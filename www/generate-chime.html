<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Chime Sound Generator</title>
</head>

<body>
    <h1>차임벨 소리 생성기</h1>
    <button onclick="generateAndDownload()">차임벨 소리 생성 및 다운로드</button>
    <button onclick="testPlay()">테스트 재생</button>

    <script>
        let audioBlob = null;

        function generateChimeSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const sampleRate = audioContext.sampleRate;
            const duration = 1.5; // 1.5초
            const length = sampleRate * duration;
            const audioBuffer = audioContext.createBuffer(1, length, sampleRate);
            const channelData = audioBuffer.getChannelData(0);

            // 첫 번째 종소리 (800Hz)
            for (let i = 0; i < length * 0.4; i++) {
                const t = i / sampleRate;
                const envelope = Math.exp(-3 * t);
                channelData[i] = Math.sin(2 * Math.PI * 800 * t) * envelope * 0.5;
            }

            // 두 번째 종소리 (600Hz) - 약간 지연
            for (let i = Math.floor(length * 0.15); i < length; i++) {
                const t = (i - length * 0.15) / sampleRate;
                const envelope = Math.exp(-2.5 * t);
                const value = Math.sin(2 * Math.PI * 600 * t) * envelope * 0.4;
                channelData[i] = channelData[i] ? (channelData[i] + value) / 2 : value;
            }

            return audioBuffer;
        }

        function audioBufferToWav(audioBuffer) {
            const numberOfChannels = audioBuffer.numberOfChannels;
            const sampleRate = audioBuffer.sampleRate;
            const format = 1; // PCM
            const bitDepth = 16;

            const bytesPerSample = bitDepth / 8;
            const blockAlign = numberOfChannels * bytesPerSample;

            const data = audioBuffer.getChannelData(0);
            const dataLength = data.length * bytesPerSample;
            const buffer = new ArrayBuffer(44 + dataLength);
            const view = new DataView(buffer);

            // WAV header
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numberOfChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(36, 'data');
            view.setUint32(40, dataLength, true);

            // PCM data
            let offset = 44;
            for (let i = 0; i < data.length; i++) {
                const sample = Math.max(-1, Math.min(1, data[i]));
                view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                offset += 2;
            }

            return buffer;
        }

        function generateAndDownload() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const audioBuffer = generateChimeSound();
            const wavData = audioBufferToWav(audioBuffer);
            audioBlob = new Blob([wavData], { type: 'audio/wav' });

            const url = URL.createObjectURL(audioBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'chime.wav';
            a.click();
            URL.revokeObjectURL(url);

            alert('차임벨 소리가 다운로드되었습니다! 파일을 pomodoro 폴더에 복사하세요.');
        }

        function testPlay() {
            if (!audioBlob) {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const audioBuffer = generateChimeSound();
                const wavData = audioBufferToWav(audioBuffer);
                audioBlob = new Blob([wavData], { type: 'audio/wav' });
            }

            const url = URL.createObjectURL(audioBlob);
            const audio = new Audio(url);
            audio.play();
        }
    </script>
</body>

</html>
