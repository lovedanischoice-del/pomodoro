<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>차임벨 소리 생성기</title>
</head>

<body>
    <h1>차임벨 소리 테스트</h1>
    <button onclick="playBell()">차임벨 재생</button>

    <script>
        // Web Audio API를 사용하여 차임벨 소리 생성
        function playBell() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();

            // 첫 번째 음 (높은 음)
            const oscillator1 = audioContext.createOscillator();
            const gainNode1 = audioContext.createGain();

            oscillator1.type = 'sine';
            oscillator1.frequency.setValueAtTime(800, audioContext.currentTime); // 높은 음

            gainNode1.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode1.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator1.connect(gainNode1);
            gainNode1.connect(audioContext.destination);

            oscillator1.start(audioContext.currentTime);
            oscillator1.stop(audioContext.currentTime + 0.5);

            // 두 번째 음 (낮은 음)
            const oscillator2 = audioContext.createOscillator();
            const gainNode2 = audioContext.createGain();

            oscillator2.type = 'sine';
            oscillator2.frequency.setValueAtTime(600, audioContext.currentTime + 0.1); // 낮은 음

            gainNode2.gain.setValueAtTime(0.3, audioContext.currentTime + 0.1);
            gainNode2.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.6);

            oscillator2.connect(gainNode2);
            gainNode2.connect(audioContext.destination);

            oscillator2.start(audioContext.currentTime + 0.1);
            oscillator2.stop(audioContext.currentTime + 0.6);
        }
    </script>
</body>

</html>
